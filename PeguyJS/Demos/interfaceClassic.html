<!DOCTYPE html>
<html>

	<head>
		<meta charset="utf-8" />
		
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="viewport" content="width=device-width, minimum-scale=1" />
		<meta name="viewport" content="width=device-width, maximum-scale=1" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name=“viewport” content=”initial-scale=1, viewport-fit=cover”>
		
		<title>Interface demo</title>
		
		<style>
			
			#main, #screen
			{
				position: absolute;
				left: 0px;
				right: 0px;
				top: 0px;
				bottom: 0px;
				
				overflow: hidden;
				
				margin: 0px;
				padding: 0px;
				
				text-align: center;
				font-family: Arial;
                    
                    background-color:   rgb(220, 220, 220);
                    background-color:   rgb(40, 40, 40);
			}
			
		</style>
			
		<link type="text/css" rel="stylesheet" media="all" href="highlight/styles/atom-one-dark-reasonable.min.css"></link>
		<script src="highlight/highlight.min.js"></script>
		<script>if (typeof hljs !== 'undefined') { hljs.initHighlightingOnLoad(); }</script>
		
	</head>
	
	<body id="main">

		<div id="screen">
			<p>Loading...</p>
		</div>
		
		<script src='../Loader.js?token=0' ></script>
		
		<script type="text/javascript" >
		
			var testLibrary;

            var displayError = function($error)
            {
	            if (testLibrary)
    	            testLibrary.getById('testPanel').displayError($error);
            };

            var emptyError = function()
            {
        	    if (testLibrary)
           	     testLibrary.getById('testPanel').emptyError();
            };

			var execTestCode = function()
			{
				if (testLibrary)
					testLibrary.getById('testPanel').exec();
			};

			new Loader('../../', 'Peguy');
			
			Loader.addModules(['all']);

			Loader.onload = function()
			{ 
				testLibrary = new PeguyTestLibrary(PeguyTestLibraryConfigs.classic);
				PEGUY.emptyScreen();
				PEGUY.appendToScreen(testLibrary);
			};
			
			window.onload = function() { Loader.load(); }; 

		</script>
		
	</body>
</html>
